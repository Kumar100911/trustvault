name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trustvault
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: trustvault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trustvault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://trustvault:devpassword@localhost:5432/trustvault_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest